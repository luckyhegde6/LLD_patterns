name: LLD Pattern CI

on:
  push:
    branches: [main, feat/python-lld-patterns-suite]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python pattern tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r Python/requirements-dev.txt
      - name: Run each Python pattern test suite
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for pattern in Python/*; do
            if [[ -d "$pattern/tests" ]]; then
              found=1
              echo "::group::Testing $pattern"
              (cd "$pattern" && python -m pytest tests -v)
              echo "::endgroup::"
            fi
          done
          if [[ "$found" -eq 0 ]]; then echo 'No Python test suites found' >&2; exit 1; fi

  typescript-tests:
    name: TypeScript pattern tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install test dependencies
        run: npm install
      - name: Run TypeScript Jest suites
        run: npm test
